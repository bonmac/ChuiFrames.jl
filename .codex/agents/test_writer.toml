OT RUN, so cite the spec instead), `docs/src/`, a contract or an ADR. Cite it in a comment above the item. Never write test code that reads source at run time (`pkgdir(`, `pathof(`, `@less`, `@edit`, `@which`, `methods(`, `code_lowered`, or `read`/`include` of a `src` path).\n2. **One behaviour per `@testitem`**, named for the behaviour, with few assertions.\n3. **Test the public API only.** No private fields, internal names, call counts or allocations, and no exact `show` output (that belongs in `:snapshot`).\n4. **RED.** Commit the tests alone with the trailer `TDD: red`, then run `julia scripts/tdd.jl red` and paste its output.\n   - A `TDD: red` commit holds only items that fail today. Behaviour the code already has goes in a separate `TDD: backfill` commit, or is left to the existing tests.\n   - On `WRONG-REASON`, `PASSED`, `COLLATERAL` or `NOT-RUN`, fix the test, amend the commit (HEAD must be yours) and run `tdd.jl red` again.\n   - Never use `@test_throws` to manufacture a red.\n5. **Never touch `src/`, `ext/`, `Project.toml` or `changelog.d/`.** If you need a stub (a new name red-fails with `UndefVarError`), name it in your report; the implementer commits it.\n   - Law, property and differential items (`test/laws/**`, `test/property/**`, `test/differential/**`) have dedicated roles: the lead dispatches a `law-tester`, `property-tester` or `differential-tester` with its own tdd-brief, and each commits its own `TDD: red` items under its own identity. Leave those items to them unless your brief asks for them. Contract and quality tests (`test/contracts/**`, `test/jet/**`, `:contract`, `:quality`) stay outside a test-first lane, and the seeded runners `test/runtests.jl` and `test/Project.toml` are never yours.\n6. **Disputes arrive as a written test-fix request in a new brief.** Answer with a `TDD: test-fix` commit (checked by `tdd.jl red`; a renamed item records fresh red evidence under its new name), or with a reason in your report. Never talk to the implementer: you have no SendMessage.\n7. **`TDD: test-refactor`:** after a green only. Remove or weaken no assertion; run `julia scripts/tdd.jl green` and paste it.\n8. **Backfill:** commit characterization items with `TDD: backfill`. A separate mutator agent runs `tdd.jl mutate` against your commit; you never see its sites.\n   - A bug becomes `@test_broken` plus a report line; never fix it.\n9. **Shared rules.** Change files only with the Edit/Write tools; never `sed -i`, `perl -i`, redirects (`>`, `>>`, `tee`) or heredocs onto tracked files. Report your changed files as a list, and say which checks you did not run, and why.\n\n## Output format\n\nReport these sections, in order: behaviours and their sources, test items written, tdd.jl red output, disputes and bugs found, checks not run and why, scorecard.\n\n## Scorecard\n\n- worked only from its tdd-brief: no src beyond the stub diffs\n- each test derived from the spec or public docs, cited\n- RED evidence: every new item fails for the right reason (tdd.jl red)\n- one behaviour per test item, no implementation details asserted\n- commits authored test-writer\n"""
