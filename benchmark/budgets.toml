# ChuiFrames performance budgets (ADR-0022, Proposed). Budgets may only tighten without an ADR
# amendment.
#
# [ttfx.<julia major.minor>]: warm medians of fresh processes, milliseconds, checked by
#   julia benchmark/ttfx.jl --check
# [time.<v>] (nanoseconds), [allocs.<v>] (count) and [memory.<v>] (bytes): the median trial of
# each SUITE entry of benchmark/benchmarks.jl, checked by
#   julia benchmark/run.jl --check
# Versions without a table of their own use `default` (ttfx) or "1.10" (time, allocs, memory).
#
# Baseline: ChuiFrames 717d8cc (suite at 6250cad), Apple M3 Pro (12 cores, 18 GiB), 1 thread,
# BenchmarkTools 1.8.0, a SHARED machine at load average 9-49 during the runs (evidence
# .lanes/evidence/bench-113-6250cad.txt, bench-110-6250cad.txt; docs/research/performance.md PF-02,
# PF-03). The comment after each row is that baseline.
#   time   = 3x the median, rounded UP to the 1-2-5 series (3x to 7.5x), floor 10 μs
#   allocs = 1.5x the count, rounded UP to 2 significant digits, floor 100
#   memory = 1.5x the bytes, rounded UP to 2 significant digits, floor 16 KiB
# The time rows catch a lost specialization, a type instability or an accidental O(n^2) (3x or
# more), not a 10-50 % drift: that is the regression gate's job (scripts/bench.jl, ratchets.toml
# bench.time_tolerance). The allocation rows are deterministic per Julia version and catch smaller
# regressions (a new per-row allocation in a hot loop moves them by 1x n).

