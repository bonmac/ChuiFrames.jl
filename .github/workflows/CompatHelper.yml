# Factory-managed (see .factory-version). Opens PRs that widen [compat] bounds.
# With a personal registry (ADR-0005), CompatHelper.main needs a `registries` keyword
# listing General and that registry: UNVERIFIED until the registry exists.
name: CompatHelper
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install CompatHelper
        run: julia -e 'using Pkg; Pkg.add(; name = "CompatHelper", uuid = "aa819f21-2bde-4658-8897-bab36330d9b7", version = "3")'
      - name: Run CompatHelper
        run: julia -e 'using CompatHelper; CompatHelper.main()'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
