# Factory-managed (see .factory-version). ADR-0011: benchmark/benchmarks.jl (`const SUITE =
# BenchmarkGroup()`) on the PR head vs its merge base with the base branch, through the factory's
# own `scripts/bench.jl` (BenchmarkTools; `julia scripts/ci.jl bench`). Factory 0.2.7 dropped the
# AirspeedVelocity action: AirspeedVelocity 0.6.6 cannot be installed next to CSV.jl 1.x (the
# JSON3 1.14.3 it pulls in caps Parsers at <= 2.8.8; CSV 1.x needs Parsers 3), so the job did
# nothing for such packages. WARNING-ONLY (ADR-0011): `continue-on-error: true`. bench.jl fails
# beyond ratchets.toml bench.time_tolerance, which only means something on a quiet runner: a
# loaded machine gave false regressions of 1.12-1.20x on identical trees. To make it blocking once
# baselines settle (a T3 change, in the repo's CHANGELOG): drop `continue-on-error`.
# On workflow_dispatch github.base_ref is empty, so the base is origin/main: in a repo whose
# default branch is not `main`, bench.jl finds no merge base (exit 2), hidden by continue-on-error.
name: Benchmark
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  ECOSYSTEM_REGISTRY_URL: ${{ vars.ECOSYSTEM_REGISTRY_URL }}
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true  # warning-only (ADR-0011)
    steps:
      # full history: bench.jl checks out the merge base with origin/<base> as a second worktree
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # the personal registry (ADR-0005) for unregistered ecosystem dependencies
      - run: julia scripts/ci.jl setup
      # no benchmark/ directory yet: a NOT RUN (waiting) notice, exit 0
      # the base branch goes through env:, never into the shell line (a branch name may hold `$(...)`)
      - run: julia scripts/ci.jl bench -- --base "origin/$BASE"
        env:
          BASE: ${{ github.base_ref || 'main' }}
