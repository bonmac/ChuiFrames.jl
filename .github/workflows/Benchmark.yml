# Factory-managed (see .factory-version). Fails when a benchmark's median is slower than the
# merge base by more than ratchets.toml bench.time_tolerance.
name: Benchmark
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  ECOSYSTEM_REGISTRY_URL: ${{ vars.ECOSYSTEM_REGISTRY_URL }}
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - run: julia scripts/ci.jl setup
      - run: julia scripts/ci.jl bench -- --base origin/${{ github.base_ref || 'main' }}
