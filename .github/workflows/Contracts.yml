# Factory-managed (see .factory-version). Upstream contract tests (ECOSYSTEM.md §2):
# against the latest upstream release (blocks a merge) and upstream main (warns only).
name: Contracts
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  ECOSYSTEM_REGISTRY_URL: ${{ vars.ECOSYSTEM_REGISTRY_URL }}
jobs:
  contracts:
    name: upstream ${{ matrix.upstream }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.upstream == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        upstream: [release, main]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - run: julia scripts/ci.jl setup
      - run: julia scripts/ci.jl contracts -- ${{ matrix.upstream }}
