prevented_by = "scripts/contract_usage.jl"
runs_in = ["ci Guards", "local scripts/ci.jl guards", "/contract-check"]
test = "scripts/test/test_contract_usage.jl"
blind_spots = ["names reached through a bare `using Upstream` (no qualifier) or generated by macros", "rule-only entries (no `names:` line) the code relies on without listing them", "that the test item actually checks the contract's statement", "a vendored contract file older than the coordinator's (refreshed by /contract-check, not by CI)", "names in strings containing `#`, and multi-line `using Up: a,` lists", "names reached through a module alias (`import Up as U`, `const U = Up`); names mentioned in docstrings count as used", "`tags = [:contract]` written on a line after the `@testitem` line"]

[[checks]]
id = "ci_entry"
rule = "Workflows call only jobs that scripts/ci.jl defines, so CI and local runs share one command list"
prevented_by = "scripts/ci.jl"
runs_in = ["ci (every workflow)", "local"]
test = "scripts/test/test_ci.jl"
blind_spots = ["workflow steps that are not ci.jl calls (setup, cache, upload, TagBot)", "the upstream-main contract run is UNVERIFIED end to end", "a skip's kind (0.2.4) is decided from the checkout: a package is `profile = package` in .factory-version or a root Project.toml; deleting both makes the package jobs `not applicable` (exit 0)", "`waiting` skips (no upstreams, no benchmark/ directory) exit 0 with a NOT RUN notice and a GitHub warning; deleting the whole benchmark/ directory turns `bench` from missing into waiting", "the format job (0.3.2) checks every host `.jl` file outside a `scripts/test/fixtures/` directory at any depth, so in a coordinator it also checks repo-owned files (contracts/, reference/) that may not be Runic-clean; the coordinator has no format CI job, and the factory's own Runic-clean test covers only factory-managed scripts (the `.factory-version` [managed] files plus factory/template/scripts/)"]

[[checks]]
id = "ci_timeout"
rule = "A bounded run (`ci.jl <job> --timeout S` or CI_TIMEOUT) leaves no process behind: on expiry the command's whole process group, Pkg.test's child julia included, is killed and ci.jl exits 124"
prevented_by = "scripts/ci.jl"
runs_in = ["local", "ci (where a workflow passes --timeout or sets CI_TIMEOUT)"]
test = "scripts/test/test_ci.jl"
blind_spots = ["a process that leaves the group (calls setsid itself, or is daemonized) escapes", "Ctrl-C (SIGINT to ci.jl) kills the group and exits 130 (review B2); any OTHER signal that ends ci.jl (SIGTERM from `timeout` or a CI cancel, SIGALRM from `perl -e alarm`, SIGKILL, SIGHUP) leaves the detached group running: nothing is left to kill it, so bound runs with --timeout, not an outer alarm", "Windows: only the leader process is killed", "without --timeout or CI_TIMEOUT nothing is bounded, as before 0.2.7", "the limit is for the whole job, checked every 0.1 s, plus up to 10 s of SIGTERM grace", "when the command finishes in time, whatever it left running in its group is SIGKILLed too, on success as well"]

[[checks]]
id = "lane_tool"
rule = "Worktree lanes live at <repo>/.worktrees/<lane>, within the cap, and are removed only when clean and merged; `lane audit` fails a lane whose changes leave its owned globs or differ from its reported files"
prevented_by = "scripts/lane.jl"
runs_in = ["local scripts/lane"]
test = "scripts/test/test_lane.jl"
blind_spots = ["`--allow-ignored` deletes ignored files the caller did not copy out", "worktrees made with plain git worktree add", "EnterWorktree lanes under .claude/worktrees/", "`lane audit` checks only the lane's own worktree: a write a lane made into ANOTHER checkout (the main checkout, a sibling lane, a nested repo) is not in its diff, and the owned globs are whatever `--owns` recorded (the lane's branch config is not tamper-proof)", "`audit` runs only when /change-review runs it (it is not a CI job)", "`branch.<b>.lane-base` and `lane-owns` live in the repo's git config: a lane that rewrites them to another real branch or to wider globs passes the audit (a base equal to the lane's branch, or not a commit, fails); the audit prints the base and owns it used so the reviewer can compare them with the brief", "the merge base uses the LOCAL `<base>` when it contains `origin/<base>` (0.2.6, also dod.jl and ratchet.jl): commits on the local base that were never reviewed or pushed are not counted as the lane's (`--base origin/<base>` audits against the remote); run ON the base branch itself (after a local merge) the gates compare it with itself and see nothing, so audit a merged lane with `--base origin/<base>`; when local and origin have diverged, origin still wins; where `origin/<base>` does not resolve (no remote, a pruned tracking ref; 0.2.7) the local `<base>` stands in, with a printed note, in lane audit, dod.jl, ratchet.jl and bench.jl, so `--base origin/<base>` then audits against the LOCAL base: lane audit fails when that local base already contains the lane's tip (it would see nothing); dod.jl and ratchet.jl do not check this, so run on the base branch after a local merge they still see nothing", "`lane new` copies `.agents/factory.local.toml` once: a later change to the main checkout's copy does not reach open lanes (copy it again and run `julia scripts/gen.jl` there)", "`lane release <key>` (0.2.8) trusts the caller: releasing a LIVE agent's lane uncounts it (the ledger records `why: released`, so the release is visible); it writes the ledger named by `[lanes] ledger` (as the hooks do) and exits 1 without claiming a release when the write fails, or when `.agents/agent-registry.toml` does not parse or its `[lanes] ledger` is not a string (a one-line message, no stacktrace)"]

[[checks]]
id = "sync_factory"
rule = "Factory updates arrive deliberately: shown as a diff, local edits never overwritten silently, version recorded"
prevented_by = "scripts/sync_factory.jl"
runs_in = ["local"]
test = "scripts/test/test_sync_factory.jl"
blind_spots = ["a `local-modified` managed file stops receiving factory updates until the edit is reverted or --force is used", "seeded files (CLAUDE.md, risk.toml, ...) are never updated after the first sync; their diff is only shown", "sync_factory's own writes to T3 paths need no T3 (FACTORY_ALLOW_T3): the guard hooks see only agent Edit/Write and Bash commands, so `sync_factory.jl --apply` rewrites protected paths unguarded", "a teammate without T3 cannot discard an applied sync: bash_guard blocks `git clean -f` and `git restore`/`git checkout` of T3 paths, so the lead (with T3) undoes it"]

