# Check register: each rule, the check that prevents it, and what that check is blind to.
# Factory-managed. Repo-specific checks go in .agents/checks.local.toml (same schema).
# `julia scripts/gen.jl` renders docs/CHECK_COVERAGE.md; scripts/test/test_gen.jl asserts every
# hook and every guard script is registered here and that each `test` file exists.

[[checks]]
id = "bash_guard"
rule = "No destructive git/rm commands, no pushes or GitHub actions without the user, no writes outside the repo root, only read-only commands inside the read-only roots of .agents/factory.toml"
prevented_by = ".claude/hooks/bash_guard.sh"
runs_in = ["hook PreToolUse(Bash)"]
test = "scripts/test/test_hooks.jl"
blind_spots = ["commands built at runtime (eval, variables, $(...), aliases, scripts, julia/python -e)", "`cd` to a computed target (`cd \"$D\"`, `cd -`, `cd` in a subshell or `sh -c '...'` string) is not followed", "read-only roots: a program in the root started by path from outside it (`sh ~/ref/run.sh`, `python ~/ref/x.py`), tools that find a project by a path argument or env var (`--manifest-path`, `UV_PROJECT`, `JULIA_PROJECT`), symlinks into a root", "the read-only allowlist trusts its tools (`less` can run `!cmd`; `git log/diff --output=f`, `rg --pre`, `git -c core.pager=...`)", "subshells, `popd` and `cd -` are not unwound, so `(cd root && ls); make` counts `make` as inside the root (a false positive, never a bypass)", "quoted arguments containing spaces (and a quoted ` > /abs/path` inside a message is a false positive)", "heredoc detection assumes `<<WORD` and a terminator line equal to WORD", "tools that write through their own config (Pkg depot, uv cache)", "Bash run outside Claude Code"]

[[checks]]
id = "write_guard"
rule = "Edit/Write tools never write outside the repo root, and never touch T3 protected paths without approval"
prevented_by = ".claude/hooks/write_guard.sh"
runs_in = ["hook PreToolUse(Edit|Write|MultiEdit|NotebookEdit)"]
test = "scripts/test/test_hooks.jl"
blind_spots = ["writes made through Bash (bash_guard covers only part)", "symlinks inside the repo pointing outside", "T0-T2 paths (left to scripts/dod.jl at merge)", "a session started inside factory/template runs the TEMPLATE's hooks with the template as root (the denial says so; dispatch lanes from the repo root)", "guards fail closed when their script is missing only if settings.json itself is intact"]

[[checks]]
id = "teammate_idle"
rule = "A teammate does not go idle without reporting"
prevented_by = ".claude/hooks/teammate_idle.sh"
runs_in = ["hook TeammateIdle"]
test = "scripts/test/test_hooks.jl"
blind_spots = ["cannot see whether a SendMessage report was sent; the second idle passes either way", "plain subagents (no TeammateIdle event)", "fails open without jq"]

[[checks]]
id = "dispatch_limit"
rule = "At most [lanes] max_open subagent lanes are open per session"
prevented_by = ".claude/hooks/dispatch_limit.sh"
runs_in = ["hook PreToolUse(Agent|Task)"]
test = "scripts/test/test_hooks.jl"
blind_spots = ["teammates may not emit SubagentStart/Stop (UNVERIFIED), so they may not be counted", "a crashed subagent with no SubagentStop stays counted until the session changes", "Workflow-tool fan-out is not counted"]

[[checks]]
id = "lane_ledger"
rule = "Every subagent start and stop is recorded in the lane ledger"
prevented_by = ".claude/hooks/lane_ledger.sh"
runs_in = ["hook SubagentStart", "hook SubagentStop"]
test = "scripts/test/test_hooks.jl"
blind_spots = ["fails open (no jq, unwritable .lanes/)", "records ids only, not outcomes"]

[[checks]]
id = "precompact"
rule = "Compaction does not lose the branch, open lanes and dirty files"
prevented_by = ".claude/hooks/precompact.sh"
runs_in = ["hook PreCompact", "hook SessionStart(compact) via .claude/hooks/session_start.sh"]
test = "scripts/test/test_hooks.jl"
blind_spots = ["decisions that exist only in the conversation", "re-injection relies on the SessionStart `compact` matcher (documented, not yet observed here)"]

[[checks]]
id = "session_start"
rule = "The pre-compaction snapshot is put back into context after compaction"
prevented_by = ".claude/hooks/session_start.sh"
runs_in = ["hook SessionStart(compact)"]
test = "scripts/test/test_hooks.jl"
blind_spots = ["prints at most 40 lines", "a stale snapshot from an earlier compaction is printed if precompact failed"]

[[checks]]
id = "gen_check"
rule = "Generated agent files, AGENTS.md, the PR template, protected paths and this table match their sources"
prevented_by = "scripts/gen.jl"
runs_in = ["ci Guards", "local scripts/ci.jl guards"]
test = "scripts/test/test_gen.jl"
blind_spots = ["prose quality of bodies and CLAUDE.md", "whether agents follow their bodies"]

[[checks]]
id = "dod"
rule = "A PR links a spec/plan (or is T0), changes tests with src/, adds a CHANGELOG entry, and has an ADR when T3"
prevented_by = "scripts/dod.jl"
runs_in = ["ci Guards (pull_request)"]
test = "scripts/test/test_dod.jl"
blind_spots = ["that the linked spec matches the change", "that the changed tests test the changed code", "review approval (left to branch protection)", "a mislabelled PR below the path-derived tier is raised, but one above is trusted"]

[[checks]]
id = "ratchet"
rule = "Coverage floor only rises, size budgets and benchmark tolerance only fall, files stay within budget"
prevented_by = "scripts/ratchet.jl"
runs_in = ["ci Guards", "ci CI (coverage, with --lcov)", "local scripts/ci.jl guards"]
test = "scripts/test/test_ratchet.jl"
blind_spots = ["compares with the merge base only, not every parent of a merge", "files not matched by any size glob", "coverage of code that is never loaded"]

[[checks]]
id = "check_docs"
rule = "Markdown links and backticked repo paths point at files that exist"
prevented_by = "scripts/check_docs.jl"
runs_in = ["ci Guards", "local scripts/ci.jl guards"]
test = "scripts/test/test_check_docs.jl"
blind_spots = ["paths outside the known prefixes", "anchors (#section)", "command flags named in docs", "the CONVENTIONS list in check_docs.jl is trusted even where a repo never creates those paths", "files excluded and references allowed by .agents/factory.toml [check_docs] (and fenced blocks when ignore_fenced = true)", "in a checkout holding the factory, a path in factory/*.md that exists only in factory/template/ passes even if it was meant as a repo path"]

[[checks]]
id = "contract_usage"
rule = "USED.md's contract IDs each have exactly one real contract test item and are live (not retired) in the upstream contract file, and every upstream name the code uses that a `names:` line covers has its ID listed"
prevented_by = "scripts/contract_usage.jl"
runs_in = ["ci Guards", "local scripts/ci.jl guards", "/contract-check"]
test = "scripts/test/test_contract_usage.jl"
blind_spots = ["names reached through a bare `using Upstream` (no qualifier) or generated by macros", "rule-only entries (no `names:` line) the code relies on without listing them", "that the test item actually checks the contract's statement", "a vendored contract file older than the coordinator's (refreshed by /contract-check, not by CI)", "names in strings containing `#`, and multi-line `using Up: a,` lists", "names reached through a module alias (`import Up as U`, `const U = Up`); names mentioned in docstrings count as used", "`tags = [:contract]` written on a line after the `@testitem` line"]

[[checks]]
id = "ci_entry"
rule = "Workflows call only jobs that scripts/ci.jl defines, so CI and local runs share one command list"
prevented_by = "scripts/ci.jl"
runs_in = ["ci (every workflow)", "local"]
test = "scripts/test/test_ci.jl"
blind_spots = ["workflow steps that are not ci.jl calls (setup, cache, upload, TagBot)", "the upstream-main contract run is UNVERIFIED end to end"]

[[checks]]
id = "lane_tool"
rule = "Worktree lanes live at <repo>/.worktrees/<lane>, within the cap, and are removed only when clean and merged"
prevented_by = "scripts/lane.jl"
runs_in = ["local scripts/lane"]
test = "scripts/test/test_lane.jl"
blind_spots = ["`--allow-ignored` deletes ignored files the caller did not copy out", "worktrees made with plain git worktree add", "EnterWorktree lanes under .claude/worktrees/"]

[[checks]]
id = "sync_factory"
rule = "Factory updates arrive deliberately: shown as a diff, local edits never overwritten silently, version recorded"
prevented_by = "scripts/sync_factory.jl"
runs_in = ["local"]
test = "scripts/test/test_sync_factory.jl"
blind_spots = ["a `local-modified` managed file stops receiving factory updates until the edit is reverted or --force is used", "seeded files (CLAUDE.md, risk.toml, ...) are never updated after the first sync; their diff is only shown"]
