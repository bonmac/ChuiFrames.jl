# Check register: each rule, the check that prevents it, and what that check is blind to.
# Factory-managed. Repo-specific checks go in .agents/checks.local.toml (same schema).
# `julia scripts/gen.jl` renders docs/CHECK_COVERAGE.md; scripts/test/test_gen.jl asserts every
# hook and every guard script is registered here and that each `test` file exists.

[[checks]]
id = "bash_guard"
rule = "No destructive git/rm commands, no pushes or GitHub actions without the user, no writes outside the repo root, no modelled writes to T3 protected paths (without the user's FACTORY_ALLOW_T3=1), only read-only commands inside the read-only roots of .agents/factory.toml"
prevented_by = ".claude/hooks/bash_guard.sh"
runs_in = ["hook PreToolUse(Bash)"]
test = "scripts/test/test_hooks.jl"
blind_spots = ["commands built at runtime: aliases, functions, scripts, julia/python -e, `sh -c '...'`/`bash -c` strings and arguments to tools that run commands (`git -c alias.x='!...'`, `make` recipes); a command NAME that is an expansion (`$X`, `$(...)`, backticks, `${IFS}`) and `eval` are blocked", "write targets held in variables (`> \"$f\"`, `cp a \"$D\"`) are not resolved and pass; only `$HOME` and `$TMPDIR` (the hook's own value) are expanded", "`cd` to a computed target (`cd \"$D\"`, `cd -`, `cd` in a subshell or `sh -c '...'` string) is not followed", "read-only roots: a program in the root started by path from outside it (`sh ~/ref/run.sh`, `python ~/ref/x.py`), tools that find a project by a path argument or env var (`--manifest-path`, `UV_PROJECT`, `JULIA_PROJECT`), symlinks into a root", "the read-only allowlist trusts its tools (`less` can run `!cmd`; `git log/diff --output=f`, `rg --pre`, `git -c core.pager=...`)", "subshells, `popd` and `cd -` are not unwound, so `(cd root && ls); make` counts `make` as inside the root (a false positive, never a bypass)", "quoted text ('...', \"...\", $'...') is one argument, never a redirect target or a second command (\"$(...)\" and backticks inside double quotes ARE split and checked; a `#` comment ends the line)", "writes outside the root AND to T3 paths (0.2.4) are modelled for redirections (incl. `>|`), rm, rmdir, mkdir, touch, chmod, chown, truncate, tee, mv, cp/ln/install/rsync (last operand, `-t`), dd of=, sed -i/perl -i, curl -o, wget -O/-P, tar -x (-C DIR, else the cwd), unzip (-d DIR, else the cwd), find -delete/-fprint, git init/clone/worktree, and (T3) git rm/mv/restore/`checkout -- PATHS`; any other tool (`tar -cf /x`, `curl -sSLo /x` clusters, `patch`, `git apply`/`am`/`stash apply`/`reset <commit> -- f`, `npm --prefix`, `pip --target`, `cmake -B`, editors, and julia/python/sh code: `julia -e 'write(\"risk.toml\", ...)'`) is not, so a T3 path is unguarded through any Bash write bash_guard does not model", "T3 through Bash: a directory target is refused when it holds a T3 path (`rm -r scripts`, `cp x scripts/`, `find . -name x -delete`, `tar -x -C .`), a false positive for a harmless write into such a directory; a write target held in a variable, built at runtime or reached through a symlink is not matched; `mkdir` and `touch` of a directory are not checked as directory targets; targets read from stdin (`find . | xargs rm`) are not seen; a glob target is expanded case-sensitively by the guard (`rm RISK.TOM?` matches nothing here, nor in sh); a find -exec command outside a short read-only list is taken to write below find's start paths (a false positive for harmless commands)", "`rm -rf` passes only on LITERAL absolute targets strictly below $TMPDIR (the hook's environment) or three levels below /private/tmp/claude-<uid>/ (so another session's or project's scratchpad of the same user can be named and deleted); symlinks are not resolved (`ln -s / $S/l && rm -rf $S/l/opt`), and a target ending in `/` or `/.` is refused", "wrappers are modelled by name and option list (env sudo doas nice time timeout xargs caffeinate exec nohup builtin command, find -exec/-ok); others (`stdbuf`, `chroot`, `parallel`, `watch`, `script`, `flock`, `ssh`) hide the command they run", "a sourced library (`_lib.sh`, `_bash_guard_lib.sh`, `_read_only_roots.sh`, `_bash_guard_cmd.sh`, `_bash_guard_write.sh`) that is missing blocks; one that is edited is trusted", "heredoc detection is bash's: an unquoted `<<WORD` outside `((...))`/`$((...))` and `<<<`; the body ends at a line equal to WORD (quotes and backslashes removed; a quoted blank ends WORD early, so only more is checked); a body never terminated is checked as commands; with several heredocs on one line only the last WORD is used", "tools that write through their own config (Pkg depot, uv cache)", "Bash run outside Claude Code"]

[[checks]]
id = "write_guard"
rule = "Edit/Write tools never write outside the repo root, never below a .git directory, and never touch T3 protected paths (of the nearest real git checkout and of the repo root; bash_guard's t3_check) without approval"
prevented_by = ".claude/hooks/write_guard.sh"
runs_in = ["hook PreToolUse(Edit|Write|MultiEdit|NotebookEdit)"]
test = "scripts/test/test_hooks.jl"
blind_spots = ["T3 paths are unguarded for any Bash write that bash_guard does not model (see bash_guard's list: julia/python/sh code, `git apply`, `patch`, editors, targets in variables); the post-hoc checks are dod.jl's T3 tier at merge and `scripts/lane audit`", "symlinks inside the repo pointing outside", "T0-T2 paths (left to scripts/dod.jl at merge)", "a session started inside factory/template runs the TEMPLATE's hooks with the template as root (the denial says so; dispatch lanes from the repo root)", "guards fail closed when their script is missing only if settings.json itself is intact", "a session rooted in a lane worktree may also write the main checkout's lane worktrees (`.worktrees/*`, `.claude/worktrees/*`: sub-lanes are siblings) and its `.lanes/reports/` (0.2.6); WHICH sibling a lane touches is left to the brief and `lane audit`, and the main checkout is found only from the lane's `.git` file (`gitdir: <main>/.git/worktrees/<n>`, trusted when `<main>/.git/worktrees/<n>/gitdir` points back at the root); a relative gitdir (`worktree.useRelativePaths`, git >= 2.48) turns this off (writes to siblings are then blocked, as in 0.2.5)", "a lane worktree root is recognised by its place (`.worktrees/<n>/`, `.claude/worktrees/<n>/`) even before it exists (0.2.6: `lane new x && cp f .worktrees/x/...`), and its T3 globs are the repo root's hooks list until it exists; a worktree made elsewhere, or a not-yet-created lane of a NESTED repo (`Pkg.jl/.worktrees/y/` from the outer root), is matched only once it exists"]

[[checks]]
id = "teammate_idle"
rule = "A teammate does not go idle without reporting"
prevented_by = ".claude/hooks/teammate_idle.sh"
runs_in = ["hook TeammateIdle"]
test = "scripts/test/test_hooks_lifecycle.jl"
blind_spots = ["cannot see whether a SendMessage report was sent; the second idle passes either way", "plain subagents (no TeammateIdle event)", "fails open without jq", "a report counts by file name in the repo root or ANY lane worktree (`.worktrees/*/`, `.claude/worktrees/*/`, 0.2.6), so a stale report of an earlier teammate with the same name passes; its content is not read"]

[[checks]]
id = "dispatch_limit"
rule = "At most [lanes] max_open lanes (Agent dispatches: subagents and teammates) are open per session (each teammate is its own session, so the cap is per agent, not per team: live agents can reach the lead's cap times 1 + the sub-leads' caps)"
prevented_by = ".claude/hooks/dispatch_limit.sh"
runs_in = ["hook PreToolUse(Agent|Task)"]
test = "scripts/test/test_hooks_lifecycle.jl"
blind_spots = ["the count is `_lanes.sh` (OPEN_LANES_JQ): a missing `_lanes.sh` blocks; an edited one is trusted", "a lane whose agent is GONE (a crash, a teammate that approved a shutdown_request) is not closed by TaskStop: for a task that is not running TaskStop fails validation, and validation errors fire no hook (docs, hooks: PostToolUseFailure); `scripts/lane release <name>` closes it (the denial names it)", "a dispatch that never runs stays open (it never ran, so FACTORY_LANE_TTL_HOURS, default 24, drops it; or `scripts/lane release`): a denied permission DIALOG fires PreToolUse but no PostToolUseFailure and no PermissionDenied (docs); another PreToolUse hook on Agent that denies (hooks for one event run in parallel, docs); auto mode's denial IS closed (PermissionDenied)", "a validation error (e.g. a malformed Agent input) fires no PreToolUse (docs), so it records nothing; whether an unknown subagent_type fails at validation or at execution is UNVERIFIED: at execution, PostToolUseFailure closes it; if neither, `scripts/lane release` covers the leak", "a lane with a `spawned` or `unknown-result` record (teammate, background, remote) stays counted however long it lives: the TTL never drops it (sub-leads run for days); only TaskStop, its SubagentStop or `scripts/lane release` close it. A FOREGROUND Agent call has no record until it returns, so one running longer than FACTORY_LANE_TTL_HOURS stops counting while it runs (reviewer m3)", "a payload that is not a JSON object is denied (fail closed); a JSON object with no name, no tool_use_id and no description is keyed `desc:`, so all such calls count as one lane (unreachable today: Agent PreToolUse payloads carry tool_use_id, and description is a required Agent input)", "two live lanes dispatched with the same name count once (re-dispatching an open name is deliberately one lane; whether Claude Code allows two live teammates with one name is UNVERIFIED)", "names that differ only in characters outside [A-Za-z0-9_./:@-] map to one key (`é` becomes `_`): they count once and are released together", "a teammate resumed by SendMessage after its TaskStop is not counted; a background subagent resumed after its SubagentStop is not counted again (SubagentStart on resume is documented but not used)", "parallel Agent calls: the hook serialises read, count and append with a lock (.lanes/.dispatch.lock; held for 5 s: deny). Whether Claude Code runs their PreToolUse hooks concurrently is not documented; a hook killed between mkdir and rmdir holds the lock up to a minute (dispatches are denied meanwhile). A lock older than 1 minute is moved aside and removed; if what was moved is fresh (another hook broke the stale lock and took a new one first) the hook puts that live lock back and denies, never removing it (re-review m1′); a stale lock that is not an empty directory is put back and denies at once (reviewer B1). Remaining window: a hook that finishes after its lock was broken as stale (it ran over a minute, beyond the 10 s hook timeout) removes the next holder's lock on exit", "a TaskStop given a ref that names no lane of the session (an internal task id) closes by description: two open lanes with that description both close", "an Agent result whose status is not completed, teammate_spawned, async_launched or remote_launched keeps the lane open and is logged as `unknown-result` (fail toward counting); `teammate_spawned` and TaskStop's `command` field are from transcripts, the other statuses and fields from the docs (Agent tool output)", "a `scripts/lane release` close (session \"*\") matches a lane of that name in every session", "a ledger written before 0.2.8 counts 0 open lanes (its start/stop lines are not dispatches)", "the count is O(dispatches x session events): ~0.8 s for 150 dispatches in 3,000 events; the hook timeout is 10 s", "Workflow-tool fan-out is not counted"]

[[checks]]
id = "lane_ledger"
rule = "Every lane dispatch result, TaskStop, auto-mode denial, and subagent start and stop is recorded in the lane ledger"
prevented_by = ".claude/hooks/lane_ledger.sh"
runs_in = ["hook PostToolUse(Agent|Task|TaskStop)", "hook PostToolUseFailure(Agent|Task|TaskStop)", "hook PermissionDenied(Agent|Task)", "hook SubagentStart", "hook SubagentStop"]
test = "scripts/test/test_hooks_lifecycle.jl"
blind_spots = ["fails open (no jq, unwritable .lanes/, missing _lanes.sh): a lost close keeps a lane counted (`scripts/lane release` frees it); dispatch_limit itself fails closed on an unwritable .lanes/", "records ids only, not outcomes", "SubagentStart/Stop do not identify in-process teammates: their ids differ from the teammate's agent_id (coordinator ledger, 2026-10-26), so only a background subagent's stop closes a lane"]

